# تصحيح imghdr
if sys.version_info >= (3, 11):
    if 'imghdr' not in sys.modules:
        fake_imghdr = types.ModuleType('imghdr')
        fake_imghdr.what = lambda file, h=None: None
        sys.modules['imghdr'] = fake_imghdr

# قراءة المتغيرات البيئية
API_ID = int(os.getenv("API_ID", 25978936))
API_HASH = os.getenv("API_HASH", "cf754dc655df0e7deff36732dbfff074")
BOT_TOKEN = os.getenv("BOT_TOKEN")

if not BOT_TOKEN:
    print("❌ BOT_TOKEN غير موجود!")
    exit(1)

# إنشاء العميل
print("⌭ جاري الاتصال بـ Telegram...")
client = TelegramClient('alrys_bot', API_ID, API_HASH)

@client.on(events.NewMessage(pattern='/start'))
async def start_handler(event):
    await event.reply('''
🚀 **مرحباً بك في بوت alrys!**

