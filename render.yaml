''')

@client.on(events.NewMessage(pattern='/help'))
async def help_handler(event):
    await event.reply('''
📋 **قائمة الأوامر:**

🔹 **الأساسية:**
/start - بدء التشغيل
/help - عرض المساعدة
/ping - اختبار الاتصال
/status - حالة البوت
/time - عرض الوقت

