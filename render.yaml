            code = event.pattern_match.group(1)
            result = eval(code)
            await event.reply(f"📊 **النتيجة:**\\n```\\n{result}\\n```")
        except Exception as e:
            await event.reply(f"❌ **خطأ:** {e}")

@client.on(events.NewMessage)
async def echo_all(event):
    if event.is_private:
        await event.reply(f"📨 **تم استلام:** {event.text}")

print("✅ البوت يعمل...")
client.start(bot_token=BOT_TOKEN)
client.run_until_disconnected()
'''
    
    with open("temp_alrys.py", "w") as f:
        f.write(temp_code)
    
    print("✅ تم إنشاء البوت المؤقت")
    return run("python3 temp_alrys.py")

# ============================================
# 🚀 التشغيل الرئيسي
# ============================================
if __name__ == "__main__":
    print("=" * 60)
    print("🔥 بوت alrys Factory")
    print(f"📅 التاريخ: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}")
    print(f"🐍 Python: {sys.version}")
    print("=" * 60)
    
    try:
        # 1. إعداد المجلدات
        setup_directories()
        
        # 2. التحقق من المتغيرات البيئية
        check_environment()
        
        # 3. بدء البوت
        success = start_main_bot()
        
        if not success:
            print("❌ فشل تشغيل البوت")
            sys.exit(1)
            
    except KeyboardInterrupt:
        print("\n⏹️ تم إيقاف البوت بواسطة المستخدم")
        sys.exit(0)
    except Exception as e:
        logger.error(f"❌ خطأ فادح: {e}")
        print(f"❌ حدث خطأ: {e}")
        sys.exit(1)
